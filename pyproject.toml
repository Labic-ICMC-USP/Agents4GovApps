[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents4gov-apps"
version = "0.1.2"
description = "Modular Python tool library for AI agents in Brazilian government applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "LABIC - ICMC/USP" }
]
keywords = [
  "agents",
  "llm",
  "tools",
  "open-webui",
  "langchain",
  "government",
  "brazil",
  "cnpq",
  "lattes",
  "openml",
  "openalex",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
browser = [
  "browser-use",
  "playwright",
  "langchain-openai",
]
openml = [
  "openml",
  "pandas",
  "numpy",
  "scikit-learn",
  "sentence-transformers",
  "joblib",
]
gnews = [
  "gnews",
  "pandas",
  "pyarrow",
  "python-dateutil",
  "openpyxl",
  "python-dotenv",
]
dev = [
  "pytest",
  "ruff",
  "build",
  "hatchling",
]

[project.urls]
Homepage = "https://github.com/Labic-ICMC-USP/Agents4GovApps"
Repository = "https://github.com/Labic-ICMC-USP/Agents4GovApps"
Issues = "https://github.com/Labic-ICMC-USP/Agents4GovApps/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agents4gov_apps"]

[tool.ruff]
src = ["src"]
line-length = 100
